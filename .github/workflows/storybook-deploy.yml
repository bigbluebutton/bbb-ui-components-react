name: Deploy Storybook to GitHub Pages

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    if: ${{ github.ref_name == 'main' || github.ref_name == 'develop' }}
    # Both branches push to gh-pages; overlapping runs would reject each other's
    # push, and the default single pending slot would drop a queued deploy.
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Storybook
        run: npm run build-storybook

      - name: Debug list Storybook output
        run: |
          echo "Working directory: $(pwd)"
          echo "List repository root:"
          ls -la
          echo "Check for storybook-static directory:" 
          if [ -d ./storybook-static ]; then
            echo "storybook-static exists - listing contents:" 
            ls -la ./storybook-static
          else
            echo "storybook-static does not exist at ./storybook-static"
          fi

      # The main deploy cleans the whole gh-pages root, develop/ included.
      - name: Preserve the develop Storybook
        if: ${{ github.ref_name == 'main' }}
        run: |
          git fetch --depth=1 origin gh-pages || exit 0
          if git ls-tree -d --name-only FETCH_HEAD develop | grep -q .; then
            git archive FETCH_HEAD develop | tar -x -C ./storybook-static
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          publish_dir: ./storybook-static
          destination_dir: ${{ github.ref_name == 'develop' && 'develop' || '' }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          keep_files: false
          allow_empty_commit: false
